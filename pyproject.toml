[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bridge-agents-server"
version = "0.1.0"
description = "Bridge-Agents server: FastAPI + database + CLI for the review-gated agent runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bridge-Agents contributors" }]
keywords = ["agent", "customer-support", "langgraph", "fastapi", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2",
    "tzdata>=2024.1",
    "bridge-agents==0.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]

[project.scripts]
bridge-agents = "app.cli:main"

[tool.uv.sources]
bridge-agents = { workspace = true }

[tool.uv.workspace]
members = ["packages/bridge_agents"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
"tests/**" = ["B008", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["app/core", "bridge_agents"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
