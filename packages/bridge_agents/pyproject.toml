[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bridge-agents"
version = "0.1.0"
description = "Core runtime for Bridge-Agents: a review-gated LangGraph pipeline, token verifiers and safety helpers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Bridge-Agents contributors" }]
keywords = ["agent", "customer-support", "langgraph", "review-gate", "jwt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "tzdata>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/bridge_agents", "README.md", "py.typed"]
