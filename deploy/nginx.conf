# Bridge-Agents: static web UI + reverse proxy to the Python server.
#
# Deploy the web release artifact (bridge-agents-web-<version>.tar.gz) into
# /var/www/bridge-agents/web, place this file in /etc/nginx/conf.d/, adjust the
# server name / TLS paths, and run the API on 127.0.0.1:8000.
#
# Everything is same-origin, so the front-end needs no CORS configuration.

server {
    listen 80;
    server_name support.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name support.example.com;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    root  /var/www/bridge-agents/web;
    index index.html;

    # Hashed build assets never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Streaming chat needs WebSocket upgrade and a long read timeout.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # SPA routes (/admin, /admin/studio, ...) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
