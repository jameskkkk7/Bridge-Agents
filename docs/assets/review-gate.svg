<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-labelledby="reviewTitle reviewDesc">
  <title id="reviewTitle">Review gate</title>
  <desc id="reviewDesc">Assistant drafts pass a local hard gate, optional provider moderation and an LLM reviewer. Approved drafts stream to the customer; blocked drafts retry within a bounded budget or are replaced by a safe fallback. A teammate can take over at any point.</desc>

  <defs>
    <filter id="reviewShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <marker id="reviewArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="reviewArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669" />
    </marker>
  </defs>

  <rect x="8" y="8" width="1224" height="414" rx="24" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="40" y="42" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Review gate</text>
  <text x="40" y="64" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Every customer-visible reply is buffered until the gate decides.</text>

  <g font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">
    <circle cx="46" cy="88" r="4" fill="#6366f1" />
    <text x="56" y="92">gate</text>
    <path d="M110 84l6 4-6 4-6-4z" fill="#f59e0b" />
    <text x="122" y="92">decision</text>
    <circle cx="196" cy="88" r="4" fill="#059669" />
    <text x="206" y="92">customer-visible</text>
  </g>

  <!-- Draft -->
  <g filter="url(#reviewShadow)">
    <rect x="40" y="170" width="150" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" />
    <rect x="40" y="170" width="4" height="80" rx="2" fill="#64748b" />
  </g>
  <text x="58" y="200" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Assistant draft</text>
  <text x="58" y="220" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">model output</text>

  <!-- Gate 1 -->
  <g filter="url(#reviewShadow)">
    <rect x="230" y="170" width="170" height="80" rx="12" fill="#ffffff" stroke="#c7d2fe" />
  </g>
  <circle cx="248" cy="188" r="10" fill="#4f46e5" />
  <text x="248" y="192" text-anchor="middle" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="266" y="193" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Local hard gate</text>
  <text x="246" y="216" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">banned words</text>
  <text x="246" y="233" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">deterministic · free</text>

  <!-- Gate 2 -->
  <g filter="url(#reviewShadow)">
    <rect x="440" y="170" width="190" height="80" rx="12" fill="#ffffff" stroke="#c7d2fe" />
  </g>
  <circle cx="458" cy="188" r="10" fill="#4f46e5" />
  <text x="458" y="192" text-anchor="middle" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="476" y="193" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Provider moderation</text>
  <text x="456" y="216" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">optional · 5 vendors</text>
  <text x="456" y="233" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">fail-open / fail-closed</text>

  <!-- Gate 3 -->
  <g filter="url(#reviewShadow)">
    <rect x="670" y="170" width="170" height="80" rx="12" fill="#ffffff" stroke="#c7d2fe" />
  </g>
  <circle cx="688" cy="188" r="10" fill="#4f46e5" />
  <text x="688" y="192" text-anchor="middle" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="706" y="193" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">LLM reviewer</text>
  <text x="686" y="216" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">policy prompt</text>
  <text x="686" y="233" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">accept · retry · block</text>

  <!-- Stream -->
  <g filter="url(#reviewShadow)">
    <rect x="930" y="130" width="190" height="80" rx="12" fill="#ffffff" stroke="#a7f3d0" />
    <rect x="930" y="130" width="4" height="80" rx="2" fill="#10b981" />
  </g>
  <text x="950" y="160" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#065f46">Stream to customer</text>
  <text x="950" y="180" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#047857">only after the gate passes</text>

  <!-- Teammate -->
  <g filter="url(#reviewShadow)">
    <rect x="930" y="28" width="190" height="70" rx="12" fill="#ffffff" stroke="#bfdbfe" />
    <rect x="930" y="28" width="4" height="70" rx="2" fill="#3b82f6" />
  </g>
  <text x="950" y="56" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">Teammate replies</text>
  <text x="950" y="76" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#1d4ed8">takeover cancels the AI reply</text>

  <!-- Fallback -->
  <g filter="url(#reviewShadow)">
    <rect x="930" y="300" width="190" height="80" rx="12" fill="#ffffff" stroke="#fecdd3" />
    <rect x="930" y="300" width="4" height="80" rx="2" fill="#f43f5e" />
  </g>
  <text x="950" y="330" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9f1239">Safe fallback</text>
  <text x="950" y="350" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#be123c">policy-safe text · never the draft</text>

  <!-- Decision -->
  <polygon points="760,272 840,320 760,368 680,320" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" />
  <text x="760" y="317" text-anchor="middle" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#92400e">Retry budget?</text>
  <text x="760" y="334" text-anchor="middle" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="10" fill="#b45309">bounded</text>

  <!-- Arrows between gates -->
  <line x1="190" y1="210" x2="228" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />
  <line x1="400" y1="210" x2="438" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />
  <line x1="630" y1="210" x2="668" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />

  <!-- Pass path -->
  <path d="M840 200 L885 200 L885 170 L928 170" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#reviewArrowGreen)" />
  <text x="886" y="192" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#047857">pass</text>

  <!-- Block path -->
  <line x1="755" y1="250" x2="758" y2="270" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />
  <text x="770" y="264" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#b45309">block</text>

  <!-- Decision no -->
  <path d="M840 320 L885 320 L885 340 L928 340" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />
  <text x="886" y="313" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#64748b">no</text>

  <!-- Fallback replaces the draft -->
  <line x1="1025" y1="300" x2="1025" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#reviewArrow)" />
  <text x="1037" y="258" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="10.5" fill="#64748b">replaces draft</text>

  <!-- Human takeover -->
  <line x1="1025" y1="130" x2="1025" y2="100" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#reviewArrow)" />
  <text x="1037" y="118" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="10.5" fill="#1d4ed8">human takeover</text>

  <!-- Retry loop -->
  <path d="M760 368 L760 400 L115 400 L115 252" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#reviewArrow)" />
  <text x="420" y="392" font-family="Kumbh Sans, Noto Sans SC, Inter, system-ui, sans-serif" font-size="11" fill="#b45309">yes · retry within the budget</text>
</svg>
