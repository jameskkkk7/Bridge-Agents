<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Bridge-Agents - self-hosted agent runtime for customer conversations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#0d1528"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.16" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0.92" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2743" stroke-width="0.6"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#54688f"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow-cyan)"/>
  <rect width="1280" height="320" fill="url(#glow-violet)"/>
  <rect x="1" y="1" width="1278" height="318" fill="none" stroke="#22304f" stroke-width="2"/>

  <line x1="652" y1="58" x2="652" y2="262" stroke="#1f2c4a" stroke-width="1.5"/>

  <text x="690" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#67e8f9">SELF-HOSTED AGENT RUNTIME</text>
  <text x="688" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Bridge-Agents</text>
  <text x="690" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0cf">Orchestrate the graph. Gate the output. Hand off to humans.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
    <rect x="690" y="220" width="152" height="34" rx="17" fill="#0c2530" stroke="#22d3ee" stroke-opacity="0.8"/>
    <text x="766" y="242" text-anchor="middle" fill="#7dd3fc">editable graph</text>
    <rect x="856" y="220" width="214" height="34" rx="17" fill="#2a2210" stroke="#f59e0b" stroke-opacity="0.8"/>
    <text x="963" y="242" text-anchor="middle" fill="#fcd34d">streaming review gate</text>
    <rect x="1084" y="220" width="146" height="34" rx="17" fill="#211a38" stroke="#a78bfa" stroke-opacity="0.8"/>
    <text x="1157" y="242" text-anchor="middle" fill="#c4b5fd">human handoff</text>
  </g>

  <g stroke="#54688f" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="126" y1="160" x2="196" y2="160"/>
    <line x1="262" y1="160" x2="326" y2="160"/>
    <line x1="392" y1="160" x2="466" y2="160"/>
    <line x1="372" y1="192" x2="372" y2="228"/>
    <line x1="348" y1="232" x2="348" y2="196"/>
  </g>
  <g stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" fill="none">
    <line x1="532" y1="160" x2="596" y2="160"/>
  </g>
  <path d="M500 132 L500 92 Q500 84 492 84 L368 84 Q360 84 360 92 L360 128" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="430" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fbbf24" text-anchor="middle">retry / fallback</text>

  <g filter="url(#soft-glow)">
    <circle cx="110" cy="160" r="15" fill="#141d31" stroke="#3c4d70" stroke-width="2"/>
    <circle cx="230" cy="160" r="30" fill="#0c2530" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="360" cy="160" r="30" fill="#131d33" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="500" cy="160" r="30" fill="#2a2210" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="620" cy="160" r="15" fill="#0d2a22" stroke="#34d399" stroke-width="2"/>
    <circle cx="360" cy="252" r="20" fill="#211a38" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fa3c6" text-anchor="middle">
    <text x="110" y="198">calling</text>
    <text x="110" y="214">client</text>
    <text x="230" y="166" fill="#7dd3fc" font-weight="600">system</text>
    <text x="230" y="210">role</text>
    <text x="360" y="166" fill="#93c5fd" font-weight="600">agent</text>
    <text x="500" y="166" fill="#fcd34d" font-weight="600">review</text>
    <text x="500" y="210">gate</text>
    <text x="620" y="198">reply</text>
    <text x="620" y="214" fill="#6ee7b7" font-weight="600">sent</text>
    <text x="360" y="286" fill="#c4b5fd" font-weight="600">tools</text>
    <text x="360" y="302" fill="#a3b2cf" font-size="11">time / calculate / search</text>
  </g>

  <g fill="#243354">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="1200" cy="270" r="2"/>
    <circle cx="860" cy="60" r="2"/>
    <circle cx="180" cy="280" r="2"/>
  </g>
</svg>
